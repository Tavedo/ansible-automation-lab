---
# roles/router/tasks/main.yml
# Router-specific tasks: interfaces, OSPF, IP routing

- name: Enable IP routing
  cisco.ios.ios_config:
    lines:
      - "ip routing"

- name: Configure loopback
  cisco.ios.ios_l3_interfaces:
    config:
      - name: Loopback0
        ipv4:
          - address: "{{ loopback_ip }}"
    state: merged

- name: Configure physical interfaces
  cisco.ios.ios_l3_interfaces:
    config:
      - name: "{{ item.name }}"
        ipv4:
          - address: "{{ item.ip }}"
    state: merged
  loop: "{{ interfaces }}"

- name: Bring up interfaces
  cisco.ios.ios_interfaces:
    config:
      - name: "{{ item.name }}"
        description: "{{ item.description }}"
        enabled: true
    state: merged
  loop: "{{ interfaces }}"

- name: Configure OSPF
  cisco.ios.ios_config:
    lines:
      - "router ospf {{ ospf_process_id }}"
      - " router-id {{ router_id }}"
      - " passive-interface default"
      - " no passive-interface {{ item.name }}"
      - " network {{ item.ip | ansible.utils.ipaddr('network/prefix') }} area {{ ospf_area }}"
  loop: "{{ interfaces | selectattr('ospf', 'equalto', true) | list }}"

- name: Save config
  cisco.ios.ios_config:
    save_when: always
