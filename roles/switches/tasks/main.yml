---
# roles/switches/tasks/main.yml
# Switch-specific tasks: VLANs, trunks, STP, access ports, management SVI

- name: Create VLANs
  cisco.ios.ios_vlans:
    config:
      - vlan_id: "{{ item.id }}"
        name: "{{ item.name }}"
        state: active
    state: merged
  loop: "{{ vlans }}"

- name: Set STP mode to Rapid-PVST
  cisco.ios.ios_config:
    lines:
      - "spanning-tree mode {{ stp_mode }}"

- name: Set STP priority (distribution switches only)
  cisco.ios.ios_config:
    lines:
      - "spanning-tree vlan {{ item.id }} priority {{ stp_priority }}"
  loop: "{{ vlans }}"
  when: inventory_hostname in groups['distribution_switches']

- name: Configure trunk interfaces
  cisco.ios.ios_config:
    lines:
      - "switchport trunk encapsulation dot1q"
      - "switchport mode trunk"
      - "switchport trunk allowed vlan {{ vlans | map(attribute='id') | join(',') }}"
      - "no shutdown"
    parents: "interface {{ item }}"
  loop: "{{ trunk_interfaces | default([]) }}"

- name: Configure uplink to router (routed port)
  cisco.ios.ios_config:
    lines:
      - "no switchport"
      - "ip address {{ mgmt_ip | ansible.utils.ipaddr('address') }} {{ mgmt_ip | ansible.utils.ipaddr('netmask') }}"
      - "no shutdown"
    parents: "interface {{ uplink_interface }}"
  when:
    - uplink_interface is defined
    - mgmt_ip is defined
    - inventory_hostname in groups['distribution_switches']

- name: Configure management SVI (access switches)
  cisco.ios.ios_config:
    lines:
      - "interface Vlan99"
      - " description MGMT-SVI"
      - " ip address {{ mgmt_ip | ansible.utils.ipaddr('address') }} {{ mgmt_ip | ansible.utils.ipaddr('netmask') }}"
      - " no shutdown"
      - "ip default-gateway {{ mgmt_gateway }}"
  when:
    - mgmt_ip is defined
    - inventory_hostname in groups['access_switches']

- name: Save config
  cisco.ios.ios_config:
    save_when: always
