---
# configure_switches.yml
# Configures VLANs, trunks, STP, and management IPs on S2-S5
# Usage: ansible-playbook playbooks/configure_switches.yml -i inventory/hosts.ini

- name: Configure IOS-XE L2 switches
  hosts: switches
  gather_facts: false
  connection: network_cli

  tasks:
    - name: Set hostname
      cisco.ios.ios_hostname:
        config:
          hostname: "{{ hostname }}"
        state: merged

    - name: Create VLANs
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item.id }}"
            name: "{{ item.name }}"
            state: active
        state: merged
      loop: "{{ vlans }}"

    - name: Configure spanning-tree mode
      cisco.ios.ios_config:
        lines:
          - "spanning-tree mode {{ stp_mode }}"

    - name: Set STP priority on distribution switches
      cisco.ios.ios_config:
        lines:
          - "spanning-tree vlan {{ item.id }} priority {{ stp_priority }}"
      loop: "{{ vlans }}"
      when: inventory_hostname in groups['distribution_switches']

    - name: Configure trunk interfaces
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item }}"
            enabled: true
        state: merged
      loop: "{{ trunk_interfaces | default([]) }}"

    - name: Set trunk encapsulation and mode
      cisco.ios.ios_config:
        lines:
          - "switchport trunk encapsulation dot1q"
          - "switchport mode trunk"
          - "switchport trunk allowed vlan {{ vlans | map(attribute='id') | join(',') }}"
        parents: "interface {{ item }}"
      loop: "{{ trunk_interfaces | default([]) }}"

    - name: Configure management SVI
      cisco.ios.ios_config:
        lines:
          - "interface Vlan99"
          - " description MGMT"
          - " ip address {{ mgmt_ip | ipaddr('address') }} {{ mgmt_ip | ipaddr('netmask') }}"
          - " no shutdown"
          - "ip default-gateway {{ mgmt_gateway }}"
      when: mgmt_ip is defined

    - name: Save configuration
      cisco.ios.ios_config:
        save_when: always
