[routers]
R1 ansible_host=192.168.255.101
R2 ansible_host=192.168.255.102
R3 ansible_host=192.168.255.103

[distribution_switches]
S2 ansible_host=192.168.250.2
S3 ansible_host=192.168.250.3

[access_switches]
S4 ansible_host=192.168.250.4
S5 ansible_host=192.168.250.5

[switches:children]
distribution_switches
access_switches

[network:children]
routers
switches

[network:vars]
ansible_user=admin
ansible_password="{{ vault_device_password }}"
ansible_become=yes
ansible_become_method=enable
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
